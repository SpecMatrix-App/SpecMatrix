name: CI

# Unsigned simulator build and unit tests only.
# No signing, certificates, or account-specific secrets are used.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Package tests (SpecMatrixKit on macOS)
        shell: bash
        run: |
          swift test --package-path Packages/SpecMatrixKit 2>&1 | tee package-tests.log
          # Fail if no tests ran, so a build that silently runs nothing cannot pass.
          grep -E 'Test run with [1-9][0-9]* tests' package-tests.log

      - name: Select an available iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, entries in sorted(devices.items(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in entries:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit("No available iPhone simulator found")
          ')
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"

      - name: Build
        run: |
          xcodebuild build \
            -project SpecMatrix.xcodeproj \
            -scheme SpecMatrix \
            -destination "id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit tests
        run: |
          xcodebuild test \
            -project SpecMatrix.xcodeproj \
            -scheme SpecMatrix \
            -destination "id=$SIM_UDID" \
            -only-testing:SpecMatrixTests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
